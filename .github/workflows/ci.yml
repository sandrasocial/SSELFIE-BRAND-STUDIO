name: CI/CD Pipeline with TypeScript Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  # Required for Vite build - using placeholder for CI
  VITE_STACK_PROJECT_ID: 'ci-placeholder'

jobs:
  typescript-validation:
    name: TypeScript Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: TypeScript Compilation Check
        id: typescript-check
        run: |
          echo "Running TypeScript compilation check..."
          # Run TypeScript without emitting files, but catch errors
          if ! npx tsc --noEmit --skipLibCheck; then
            echo "TypeScript compilation failed!"
            echo "typescript_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "TypeScript compilation passed!"
            echo "typescript_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: TypeScript Strict Check (no-skip-lib-check)
        id: typescript-strict
        continue-on-error: true
        run: |
          echo "Running strict TypeScript check..."
          # More strict check without skipLibCheck for comprehensive validation
          if ! npx tsc --noEmit; then
            echo "Strict TypeScript check failed - this indicates potential library type issues"
            echo "strict_typescript_status=failed" >> $GITHUB_OUTPUT
          else
            echo "strict_typescript_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: ESLint Check
        id: eslint-check
        run: |
          echo "Running ESLint with TypeScript rules..."
          # Run ESLint with zero warnings tolerance
          if ! npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0; then
            echo "ESLint failed!"
            echo "eslint_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "ESLint passed!"
            echo "eslint_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: TypeScript Project References Check
        id: project-references
        run: |
          echo "Checking TypeScript project references..."
          # Check server TypeScript compilation
          if ! npx tsc -p tsconfig.server.json --noEmit --skipLibCheck; then
            echo "Server TypeScript compilation failed!"
            echo "server_typescript_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "server_typescript_status=passed" >> $GITHUB_OUTPUT
          fi

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: typescript-validation
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: Build Client
        id: build-client
        run: |
          echo "Building client application..."
          if ! npm run build; then
            echo "Client build failed!"
            echo "client_build_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Client build successful!"
            echo "client_build_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Build Server
        id: build-server
        run: |
          echo "Building server application..."
          if ! npm run build:server; then
            echo "Server build failed!"
            echo "server_build_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Server build successful!"
            echo "server_build_status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Build API for Vercel
        id: build-api
        run: |
          echo "Building API for Vercel deployment..."
          if ! npm run build:api; then
            echo "API build failed!"
            echo "api_build_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "API build successful!"
            echo "api_build_status=passed" >> $GITHUB_OUTPUT
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: Run security audit
        run: |
          echo "Running npm security audit..."
          # Allow moderate vulnerabilities but fail on high/critical
          npm audit --audit-level moderate || true
          
          # Check for high and critical vulnerabilities specifically
          if npm audit --audit-level high --json | grep -q '"vulnerabilities"'; then
            echo "High or critical vulnerabilities found!"
            npm audit --audit-level high
            exit 1
          fi

  test-validation:
    name: Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: Check for test configuration
        id: check-tests
        run: |
          if [ -f "jest.config.js" ] || [ -f "jest.config.ts" ] || [ -f "vitest.config.ts" ] || grep -q '"test"' package.json; then
            echo "Test configuration found"
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "No test configuration found - skipping test execution"
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          echo "Running tests..."
          npm test

      - name: Run Storybook tests (if available)
        if: steps.check-tests.outputs.has_tests == 'true'
        continue-on-error: true
        run: |
          if command -v storybook &> /dev/null; then
            echo "Running Storybook tests..."
            npm run test-storybook || echo "Storybook tests not configured"
          fi

  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [typescript-validation, build-validation, security-audit]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Deployment summary
        run: |
          echo "All checks passed! Deployment ready."
          echo "- TypeScript validation: ✅"
          echo "- Build validation: ✅" 
          echo "- Security audit: ✅"
          echo "Ready for Vercel deployment"

  # Status check job that other workflows can depend on
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [typescript-validation, build-validation, security-audit, test-validation]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.typescript-validation.result }}" == "success" && 
                "${{ needs.build-validation.result }}" == "success" && 
                "${{ needs.security-audit.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ CI checks failed!"
            echo "TypeScript validation: ${{ needs.typescript-validation.result }}"
            echo "Build validation: ${{ needs.build-validation.result }}"
            echo "Security audit: ${{ needs.security-audit.result }}"
            echo "Test validation: ${{ needs.test-validation.result }}"
            exit 1
          fi