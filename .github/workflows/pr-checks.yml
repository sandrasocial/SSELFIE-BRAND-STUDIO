name: PR Validation

on:
  pull_request:
    branches: [ production-ready ]
    
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: TypeScript Check
        run: npx tsc --noEmit
        
      - name: Lint
        run: npm run lint
        
      - name: Test Critical Path
        run: npm run test:critical
        
      - name: Build Check
        run: npm run build