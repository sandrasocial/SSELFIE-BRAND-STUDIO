name: Repository Organization Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  organization-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Check Directory Structure
      run: |
        # Verify core directories exist
        for dir in "client" "server" "shared" "components" "pages" "public"; do
          if [ ! -d "$dir" ]; then
            echo "❌ Missing required directory: $dir"
            exit 1
          fi
        done
        echo "✅ Core directory structure verified"
        
    - name: Check File Naming Conventions
      run: |
        # Check component files follow PascalCase
        find components pages -name "*.tsx" -o -name "*.jsx" | while read file; do
          basename=$(basename "$file")
          if [[ ! $basename =~ ^[A-Z][a-zA-Z0-9]*\.(tsx|jsx)$ ]]; then
            echo "❌ Invalid component filename: $file"
            exit 1
          fi
        done
        echo "✅ Component naming conventions verified"
        
    - name: Check Import Organization
      run: |
        # Import organization check - ensure blank line after import block
        # Only check project files, not node_modules
        find . -name "*.ts" -o -name "*.tsx" | grep -v node_modules | while read file; do
          # Skip files that don't have imports
          if ! grep -q "^import" "$file"; then
            continue
          fi
          
          # Use awk to find the actual end of the import block and check for blank line
          has_blank_after_imports=$(awk '
            BEGIN { in_imports = 0; last_import_line = 0 }
            /^import/ { in_imports = 1; last_import_line = NR }
            /^[^import]/ && in_imports && !/^\/\*/ && !/^\*/ && !/^\/\// && NF > 0 {
              # Found first non-import, non-comment line after imports
              if (NR == last_import_line + 1) {
                # No blank line after imports
                print "0"
                exit
              } else {
                # There is a blank line
                print "1"
                exit
              }
            }
            END { if (last_import_line > 0) print "1" }  # File only has imports, ok
          ' "$file")
          
          if [ "$has_blank_after_imports" = "0" ]; then
            echo "❌ Import organization issue in: $file (missing blank line after imports)"
          fi
        done
        echo "✅ Import organization check completed"
        
    - name: Check File Size Limits
      run: |
        # Check file sizes - practical limit that allows for complex data files and schemas
        find . -name "*.ts" -o -name "*.tsx" | grep -v node_modules | while read file; do
          lines=$(wc -l < "$file")
          if [ "$lines" -gt 2600 ]; then
            echo "❌ File too large: $file ($lines lines)"
            exit 1
          fi
        done
        echo "✅ File size limits verified"
        
    - name: Check Directory Depth
      run: |
        # Check directory depth
        if find . -type d -not -path "./node_modules/*" -not -path "./.git/*" | grep -q "/./././."; then
          echo "❌ Directory depth exceeds 4 levels"
          exit 1
        fi
        echo "✅ Directory depth verified"