name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'vite.config.ts'
      - 'vite.optimized.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.server.json'
      - 'drizzle.config.ts'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          NODE_ENV: production
        run: |
          # Add your deployment commands here
          echo "Deploying to production..."