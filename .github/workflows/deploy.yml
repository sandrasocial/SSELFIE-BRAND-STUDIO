name: Vercel Deployment

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI/CD Pipeline with TypeScript Checks"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI checks passed
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --force

      - name: Verify TypeScript before deploy
        run: |
          echo "Final TypeScript check before deployment..."
          npx tsc --noEmit --skipLibCheck

      - name: Build for production
        env:
          NODE_ENV: production
          VITE_STACK_PROJECT_ID: ${{ secrets.VITE_STACK_PROJECT_ID }}
        run: |
          echo "Building for production deployment..."
          npm run vercel-build

      - name: Deploy to Vercel
        run: |
          echo "Deployment would occur here via Vercel's automatic deployment"
          echo "Vercel will automatically deploy when main branch is updated"
          echo "Manual deployment can be triggered via Vercel CLI if needed"