<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Auth Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-box { background: #f5f5f5; padding: 20px; margin: 10px 0; border-radius: 5px; }
        .error { background: #fee; border: 1px solid #fcc; }
        .success { background: #efe; border: 1px solid #cfc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Stack Auth Local Debug Test</h1>
    
    <div class="debug-box">
        <h2>Environment Check</h2>
        <div id="env-check"></div>
    </div>
    
    <div class="debug-box">
        <h2>Network Test</h2>
        <button onclick="testAPI()">Test Stack Auth API</button>
        <div id="network-result"></div>
    </div>
    
    <div class="debug-box">
        <h2>Error Log</h2>
        <div id="error-log"></div>
    </div>

    <script>
        // Error logging
        const errorLog = document.getElementById('error-log');
        const logError = (message) => {
            console.error(message);
            errorLog.innerHTML += `<div class="error">${new Date().toISOString()}: ${message}</div>`;
        };

        // Environment check
        const envCheck = document.getElementById('env-check');
        envCheck.innerHTML = `
            <strong>Current URL:</strong> ${window.location.href}<br>
            <strong>Project ID:</strong> ${window.__STACK_PROJECT_ID__ || 'Not found'}<br>
            <strong>Client Key:</strong> ${(window.__STACK_PUBLISHABLE_CLIENT_KEY__ || 'Not found').substring(0, 20)}...<br>
            <strong>User Agent:</strong> ${navigator.userAgent}<br>
            <strong>Cookies:</strong> ${document.cookie || 'None'}<br>
        `;

        // Test Stack Auth API
        async function testAPI() {
            const result = document.getElementById('network-result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/auth/', {
                    headers: {
                        'x-stack-project-id': '253d7343-a0d4-43a1-be5c-822f590d40be',
                        'x-stack-publishable-client-key': 'pck_bqv6htnwq1f37nd2fn6qatxx2f8x0tnxvjj7xwgh1zmhg',
                        'x-stack-access-type': 'client'
                    }
                });
                
                const text = await response.text();
                result.innerHTML = `
                    <div class="success">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Response:</strong> ${text.substring(0, 200)}...
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                logError(`API test failed: ${error.message}`);
            }
        }

        // Error handlers
        window.addEventListener('error', (event) => {
            logError(`Global error: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('unhandledrejection', (event) => {
            logError(`Unhandled promise rejection: ${event.reason}`);
        });

        // Test the API on load
        setTimeout(testAPI, 1000);
    </script>
</body>
</html>
